<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get in touch with Sebastian Szeliga by email at ss5764@njit.edu.">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="images/monogram.svg?v=5215a69064c3" type="image/svg+xml">
    <title>Contact | Sebastian Szeliga</title>
    <script src="js/theme.js?v=cae71dd46cd4"></script>
    <link rel="stylesheet" href="css/styles.css?v=61d982dbdb3d">
    <script src="js/main.js?v=89414db6988f" defer></script>
  </head>
  <body id="top">

    <header class="site-header page-width">
      <a class="brand" href="index.html#top" aria-label="Sebastian Szeliga, Home">
        <img class="brand-monogram" src="images/monogram.svg?v=5215a69064c3" alt="" width="32" height="32">
        <span>Sebastian Szeliga</span>
      </a>

      <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
        <a class="nav-link nav-page-link" href="index.html#top">Home</a>
        <a class="nav-link nav-page-link" href="about.html#top">About</a>
        <a class="nav-link nav-page-link" href="projects.html#top">Projects</a>
        <a class="nav-link nav-page-link" href="skills.html#top">Skills</a>
        <a class="nav-link nav-page-link" href="#top" aria-current="page">Contact</a>
      </nav>

      <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <g class="theme-sun">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </g>
          <path class="theme-moon" d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/>
        </svg>
      </button>
    </header>

    <main id="main" class="content-page page-width page-enter" tabindex="-1">
      <section id="contact" class="contact-layout" aria-labelledby="contact-heading" tabindex="-1">
        <div class="contact-intro">
          <p class="eyebrow">Correspondence</p>
          <h1 id="contact-heading">Contact</h1>
        </div>

        <div class="contact-card">
          <h2>Email</h2>
          <a class="contact-email" href="mailto:ss5764@njit.edu">ss5764@njit.edu <svg class="ui-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12"/></svg></a>
        </div>

        <form id="contact-form" class="contact-form" aria-labelledby="contact-form-heading" novalidate>
          <h2 id="contact-form-heading">Write a message</h2>
          <div class="contact-fields">
            <div class="contact-field"><label for="contact-name">Name</label><input id="contact-name" name="name" autocomplete="name" maxlength="80" required aria-describedby="contact-name-error"><p id="contact-name-error" class="input-error"></p></div>
            <div class="contact-field"><label for="contact-email">Your email</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="contact-email-error"><p id="contact-email-error" class="input-error"></p></div>
            <div class="contact-field contact-message-field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="7" maxlength="4000" required aria-describedby="contact-message-error"></textarea><p id="contact-message-error" class="input-error"></p></div>
          </div>
          <div class="contact-actions"><button id="prepare-email" class="button" type="submit" disabled>Create email draft <svg class="ui-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12"/></svg></button><a id="contact-draft-link" class="text-link" hidden>Open email draft <svg class="ui-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12"/></svg></a></div>
          <p id="contact-form-status" class="contact-form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer page-width">
      <p>Sebastian Szeliga</p>
      <p>Portfolio</p>
    </footer>
  </body>
</html>
